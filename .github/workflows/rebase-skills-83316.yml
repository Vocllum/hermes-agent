name: Inspect skill removal lifecycle call sites

on:
  push:
    branches:
      - ci/rebase-skills-83316

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Inspect live upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --depth=1 upstream main
          git checkout --detach FETCH_HEAD
          echo '=== skill_manager_tool delete path ==='
          grep -n -B 30 -A 35 'forget(name)' tools/skill_manager_tool.py || true
          echo '=== skill_usage lifecycle wrapper ==='
          grep -n -B 25 -A 55 'def _emit_skill_lifecycle' tools/skill_usage.py || true
          echo '=== skill_usage forget ==='
          grep -n -B 20 -A 35 '^def forget' tools/skill_usage.py || true
          echo '=== hub uninstall implementation ==='
          grep -n -B 30 -A 90 '^def uninstall_skill' tools/skills_hub_install.py || true
          echo '=== hooks lifecycle docs ==='
          grep -n -B 20 -A 70 'on_skill_lifecycle' website/docs/user-guide/features/hooks.md || true
