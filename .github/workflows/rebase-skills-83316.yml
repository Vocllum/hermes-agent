      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused removal lifecycle tests
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -q \
            tests/tools/test_skill_usage.py \
            tests/tools/test_skill_manager_tool.py::TestDeleteSkill \
            tests/tools/test_skills_hub.py::TestInstallPathSafety

      - name: Ruff changed Python files
        shell: bash
        run: |
          source .venv/bin/activate
          ruff check \
            tools/skill_usage.py \
            tools/skill_manager_tool.py \
            tools/skills_hub_install.py \
            tests/tools/test_skill_usage.py \
            tests/tools/test_skill_manager_tool.py \
            tests/tools/test_skills_hub.py

      - name: Commit and push clean branch
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git add \
            tools/skill_usage.py \
            tools/skill_manager_tool.py \
            tools/skills_hub_install.py \
            tests/tools/test_skill_usage.py \
            tests/tools/test_skill_manager_tool.py \
