name: Rebuild skill removal lifecycle PR

on:
  push:
    branches:
      - ci/rebase-skills-83316

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Build clean current-main feature branch
        shell: bash
        run: |
          set -euxo pipefail
          cp .ci/rebuild_skills_83316.py /tmp/rebuild_skills_83316.py
          git config user.name "Vocllum"
          git config user.email "149675937+Vocllum@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --depth=1 upstream main
          git checkout -B rebase/skills-83316-clean FETCH_HEAD
          python /tmp/rebuild_skills_83316.py
          git diff --check
          git status --short
          git diff --stat

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused removal lifecycle tests
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -q \
            tests/tools/test_skill_usage.py \
            tests/tools/test_skill_manager_tool.py::TestDeleteSkill \
            tests/tools/test_skills_hub.py::TestInstallPathSafety

      - name: Ruff changed Python files
        shell: bash
        run: |
          source .venv/bin/activate
          ruff check \
            tools/skill_usage.py \
            tools/skill_manager_tool.py \
            tools/skills_hub_install.py \
            tests/tools/test_skill_usage.py \
            tests/tools/test_skill_manager_tool.py \
            tests/tools/test_skills_hub.py

      - name: Commit and push clean branch
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git add \
            tools/skill_usage.py \
            tools/skill_manager_tool.py \
            tools/skills_hub_install.py \
            tests/tools/test_skill_usage.py \
            tests/tools/test_skill_manager_tool.py \
            tests/tools/test_skills_hub.py \
            website/docs/user-guide/features/hooks.md
          git commit -m "fix(skills): emit lifecycle events for removals"
          git push origin HEAD:refs/heads/rebase/skills-83316-clean --force
