name: Rebuild double Enter PR

on:
  push:
    branches: [ci/rebase-double-enter-103559]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Replay feature on live upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Vocllum"
          git config user.email "149675937+Vocllum@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --depth=1 upstream main
          base_sha="$(git rev-parse FETCH_HEAD)"
          echo "REPLAY_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

          git fetch --depth=2 origin feat/desktop-double-enter-continue
          feature_sha="$(git rev-parse FETCH_HEAD)"
          git checkout -B rebase/103559-clean "$base_sha"
          if ! git cherry-pick "$feature_sha"; then
            echo 'CONFLICTS:'
            git diff --name-only --diff-filter=U
            echo 'COMBINED_DIFF:'
            git diff --cc --unified=25
            exit 11
          fi

          git reset --soft "$base_sha"
          git commit -m "feat(desktop): opt-in double-Enter Continue nudge"
          git diff --check "$base_sha"...HEAD
          git diff --stat "$base_sha"...HEAD

      - name: Set up Node 22.22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run composer and i18n tests
        working-directory: apps/desktop
        run: npx vitest run --project ui src/app/chat/composer src/i18n

      - name: Typecheck Desktop
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Lint and format-check changed Desktop files
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t files < <(git diff --name-only "$REPLAY_BASE_SHA"...HEAD -- apps/desktop | grep -E '\.(ts|tsx)$' || true)
          test "${#files[@]}" -gt 0
          cd apps/desktop
          rel=("${files[@]#apps/desktop/}")
          npx eslint --no-warn-ignored "${rel[@]}"
          npx prettier --check "${rel[@]}"

      - name: Validate changed Python config files
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          mapfile -t pyfiles < <(git diff --name-only "$REPLAY_BASE_SHA"...HEAD | grep -E '\.py$' || true)
          test "${#pyfiles[@]}" -gt 0
          ruff check "${pyfiles[@]}"
          python - <<'PY'
          from hermes_cli.config_defaults import DEFAULT_CONFIG
          from hermes_cli.web_server_config import CONFIG_SCHEMA

          assert DEFAULT_CONFIG['display']['double_enter_continue'] is False
          entry = CONFIG_SCHEMA['display.double_enter_continue']
          assert entry['type'] == 'boolean'
          assert entry['category'] == 'display'
          print(entry)
          PY

      - name: Push clean branch only if upstream main did not move
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check HEAD^...HEAD
          git fetch --depth=1 upstream main
          test "$(git rev-parse FETCH_HEAD)" = "$REPLAY_BASE_SHA"
          git push origin HEAD:refs/heads/rebase/103559-clean --force
