name: Temporary rebuild 104101 v2

on:
  push:
    branches:
      - tmp/rebuild-104101-v2

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Apply focused current-main fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tui_gateway/methods_projects.py')
          text = path.read_text()
          old = '''    tree = project_tree.build_tree(
              projects, sessions, discovered, git_probe.resolve, preview_limit=preview_limit,
              hydrate=hydrate, is_junk_root=_is_repo_junk, is_junk_cwd=_is_session_cwd_junk,
              exists=_dir_exists_cached)
          '''.rstrip()
          new = '''    configured_root = ""
              with contextlib.suppress(Exception):
                  from hermes_constants import get_hermes_home
                  configured = _profile_configured_cwd(Path(get_hermes_home()))
                  if configured:
                      configured_root = os.path.normcase(os.path.realpath(configured))

              # The configured default workspace is represented by the synthetic, pathless Home
              # bucket. Reuse build_tree's existing junk-policy hooks so ONLY that exact root is
              # prevented from becoming an auto/discovered project; nested repos remain distinct.
              def _home_owns_root(value: str) -> bool:
                  return bool(
                      configured_root
                      and os.path.normcase(os.path.realpath(value)) == configured_root
                  )

              tree = project_tree.build_tree(
                  projects, sessions, discovered, git_probe.resolve, preview_limit=preview_limit,
                  hydrate=hydrate,
                  is_junk_root=lambda root: _is_repo_junk(root) or _home_owns_root(root),
                  is_junk_cwd=lambda cwd: _is_session_cwd_junk(cwd) or _home_owns_root(cwd),
                  exists=_dir_exists_cached)
          '''.rstrip()
          if old not in text:
              raise SystemExit('target build_tree call not found exactly once')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/tui_gateway/test_projects_default_workspace.py')
          test.write_text('''from tui_gateway import server\n\n\ndef _session(sid: str, cwd: str) -> dict:\n    return {\n        "id": sid,\n        "cwd": cwd,\n        "git_branch": "main",\n        "git_repo_root": "",\n        "started_at": 1,\n        "last_active": 1,\n    }\n\n\ndef test_configured_default_root_folds_into_pathless_home_but_nested_repo_stays_auto(\n    monkeypatch, tmp_path\n):\n    configured = tmp_path / "Hermes"\n    nested = configured / "nested"\n    configured.mkdir()\n    nested.mkdir()\n\n    sessions = [_session("home-session", str(configured)), _session("nested-session", str(nested))]\n    discovered = [\n        {"root": str(configured), "label": "Hermes", "sessions": 1, "last_active": 1},\n        {"root": str(nested), "label": "nested", "sessions": 1, "last_active": 1},\n    ]\n\n    def resolve(cwd: str):\n        if cwd == str(configured):\n            return {"repo_root": str(configured), "worktree_root": str(configured)}\n        if cwd == str(nested):\n            return {"repo_root": str(nested), "worktree_root": str(nested)}\n        return None\n\n    monkeypatch.setattr(server, "_profile_configured_cwd", lambda _home: str(configured))\n    monkeypatch.setattr(\n        server,\n        "_project_tree_inputs",\n        lambda _db, _limit, *, include_discovered: (sessions, [], discovered, None),\n    )\n    monkeypatch.setattr(server.git_probe, "warm_roots", lambda *_args, **_kwargs: None)\n    monkeypatch.setattr(server.git_probe, "resolve", resolve)\n\n    tree, _active = server._build_project_tree(\n        object(), preview_limit=3, hydrate=True, session_limit=10, include_discovered=True\n    )\n\n    by_id = {project["id"]: project for project in tree["projects"]}\n    home = by_id["__no_project__"]\n\n    assert str(configured) not in by_id\n    assert home["path"] is None\n    assert home["isNoProject"] is True\n    assert {\n        session["id"]\n        for repo in home["repos"]\n        for group in repo["groups"]\n        for session in group["sessions"]\n    } == {"home-session"}\n\n    nested_project = by_id[str(nested)]\n    assert nested_project["isAuto"] is True\n    assert nested_project["label"] == "nested"\n''')
          PY
      - name: Focused tests
        run: uv run pytest tests/tui_gateway/test_projects_default_workspace.py tests/tui_gateway/test_project_tree.py tests/tui_gateway/test_projects_rpc.py -q
      - name: Ruff
        run: uv run ruff check tui_gateway/methods_projects.py tests/tui_gateway/test_projects_default_workspace.py
      - name: Commit cleaned result
        shell: bash
        run: |
          rm .github/workflows/tmp-rebuild-104101-v2.yml
          git config user.name "Vocllum"
          git config user.email "149675937+Vocllum@users.noreply.github.com"
          git add tui_gateway/methods_projects.py tests/tui_gateway/test_projects_default_workspace.py .github/workflows/tmp-rebuild-104101-v2.yml
          git commit -m "fix(projects): keep configured default root in Home"
          git push origin HEAD:tmp/rebuild-104101-v2
