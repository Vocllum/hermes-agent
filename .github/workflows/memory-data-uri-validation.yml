name: Memory data URI validation

on:
  push:
    branches: [ci/validate-memory-data-uri-110512]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Replay feature on live upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Vocllum"
          git config user.email "149675937+Vocllum@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --depth=1 upstream main
          base_sha="$(git rev-parse FETCH_HEAD)"
          echo "REPLAY_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

          git fetch --depth=4 origin fix/strip-data-uri-from-memory-sync
          mapfile -t commits < <(git rev-list --reverse --max-count=3 FETCH_HEAD)
          test "${#commits[@]}" -eq 3

          git checkout -B rebase/110512-clean "$base_sha"
          for commit in "${commits[@]}"; do
            if ! git cherry-pick "$commit"; then
              echo 'CONFLICTS:'
              git diff --name-only --diff-filter=U
              echo 'COMBINED_DIFF:'
              git diff --cc --unified=20
              exit 11
            fi
          done

          git reset --soft "$base_sha"
          git commit -m "fix(memory): sanitize embedded data before persistence"
          git diff --check "$base_sha"...HEAD
          test "$(git diff --name-only "$base_sha"...HEAD | wc -l)" -eq 3
          git diff --stat "$base_sha"...HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Run focused tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh \
            tests/agent/test_memory_data_uri_sanitization.py \
            tests/agent/test_memory_provider.py \
            tests/run_agent/test_run_agent_multimodal_prologue.py
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Run blocking Ruff rules on touched Python files
        run: |
          source .venv/bin/activate
          ruff check \
            agent/codex_responses_adapter.py \
            agent/memory_manager.py \
            tests/agent/test_memory_data_uri_sanitization.py \
            tests/agent/test_memory_provider.py

      - name: Push clean branch only if upstream main did not move
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check HEAD^...HEAD
          git fetch --depth=1 upstream main
          test "$(git rev-parse FETCH_HEAD)" = "$REPLAY_BASE_SHA"
          git push origin HEAD:refs/heads/rebase/110512-clean --force
