name: Citation focused validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - name: Use npm 12
        run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - name: Install dependencies
        run: npm ci
      - name: Desktop typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Desktop lint
        working-directory: apps/desktop
        run: npm run lint
      - name: Citation regression tests
        working-directory: apps/desktop
        run: npm run test:ui -- src/components/assistant-ui/markdown-citations.test.ts src/components/assistant-ui/markdown-text.test.ts
