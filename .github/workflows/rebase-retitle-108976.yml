name: Rebuild manual retitle PR

on:
  push:
    branches:
      - ci/rebase-retitle-108976

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Replay feature on live upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Vocllum"
          git config user.email "149675937+Vocllum@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --depth=1 upstream main
          base_sha="$(git rev-parse FETCH_HEAD)"
          echo "REPLAY_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

          git fetch --depth=2 origin feat/manual-session-retitle
          feature_sha="$(git rev-parse FETCH_HEAD)"
          git checkout -B rebase/manual-retitle-108976-clean "$base_sha"
          if ! git cherry-pick "$feature_sha"; then
            echo 'CONFLICTS:'
            git diff --name-only --diff-filter=U
            echo 'COMBINED_DIFF:'
            git diff --cc --unified=20
            exit 11
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/tui_gateway/test_session_retitle_rpc.py")
          text = path.read_text()
          old = "    mod._sessions.clear()\n    mod._pending.clear()\n    mod._answers.clear()\n"
          new = "    mod._sessions.clear()\n"
          if old not in text:
              raise SystemExit("expected legacy gateway teardown block not found")
          path.write_text(text.replace(old, new, 1))
          PY

          git reset --soft "$base_sha"
          git add -A
          git commit -m "feat(session): add minimal manual retitle primitive"
          git diff --check "$base_sha"...HEAD
          mapfile -t files < <(git diff --name-only "$base_sha"...HEAD)
          test "${#files[@]}" -eq 4
          printf '%s\n' "${files[@]}" | diff -u <(printf '%s\n' \
            agent/session_retitle.py \
            tests/agent/test_session_retitle.py \
            tests/tui_gateway/test_session_retitle_rpc.py \
            tui_gateway/methods_session_control.py) -

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused retitle tests
        shell: bash
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh \
            tests/agent/test_session_retitle.py \
            tests/tui_gateway/test_session_retitle_rpc.py \
            tests/agent/test_title_generator.py

      - name: Ruff changed Python files
        shell: bash
        run: |
          source .venv/bin/activate
          ruff check \
            agent/session_retitle.py \
            tui_gateway/methods_session_control.py \
            tests/agent/test_session_retitle.py \
            tests/tui_gateway/test_session_retitle_rpc.py

      - name: Publish validated head only if upstream main did not move
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check HEAD^...HEAD
          git fetch --depth=1 upstream main
          test "$(git rev-parse FETCH_HEAD)" = "$REPLAY_BASE_SHA"
          git push origin \
            HEAD:refs/heads/rebase/manual-retitle-108976-clean \
            HEAD:refs/heads/feat/manual-session-retitle \
            --force
