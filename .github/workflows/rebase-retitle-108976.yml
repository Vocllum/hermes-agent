name: Rebuild manual retitle PR

on:
  push:
    branches:
      - ci/rebase-retitle-108976

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Replay feature commits on live upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Vocllum"
          git config user.email "149675937+Vocllum@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --depth=1 upstream main
          base_sha="$(git rev-parse FETCH_HEAD)"
          git fetch --depth=8 origin feat/manual-session-retitle
          mapfile -t commits < <(git rev-list --reverse --max-count=7 FETCH_HEAD)
          test "${#commits[@]}" -eq 7
          printf 'feature commits:\n%s\n' "${commits[@]}"
          git checkout -B rebase/manual-retitle-108976-clean "$base_sha"
          for commit in "${commits[@]}"; do
            if ! git cherry-pick "$commit"; then
              echo 'CONFLICTS:'
              git diff --name-only --diff-filter=U
              echo 'COMBINED_DIFF:'
              git diff --cc --unified=20
              exit 11
            fi
          done
          git reset --soft "$base_sha"
          git commit -m "feat(session): add minimal manual retitle primitive"
          git diff --check "$base_sha"...HEAD
          git diff --stat "$base_sha"...HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused retitle tests
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -q \
            tests/agent/test_session_retitle.py \
            tests/tui_gateway/test_session_retitle_rpc.py \
            tests/agent/test_title_generator.py

      - name: Ruff changed Python files
        shell: bash
        run: |
          source .venv/bin/activate
          ruff check \
            agent/session_retitle.py \
            tui_gateway/methods_session_control.py \
            tests/agent/test_session_retitle.py \
            tests/tui_gateway/test_session_retitle_rpc.py

      - name: Push clean branch
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check HEAD^...HEAD
          git push origin HEAD:refs/heads/rebase/manual-retitle-108976-clean --force
